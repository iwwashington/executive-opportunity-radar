name: Radar frontend smoke test

on:
  pull_request:
    paths:
      - 'aggregate.py'
      - 'sources.json'
      - 'test_aggregate.py'
      - 'test_coverage.py'
      - 'requirements.txt'
      - 'index.html'
      - 'test_site.py'
      - '.github/workflows/check-site.yml'
      - '.github/workflows/deploy-static.yml'
      - '.github/workflows/update-radar.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser testing dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Verify pipeline controls
        run: |
          python test_aggregate.py
          python test_coverage.py
      - name: Verify JavaScript syntax and browser startup
        run: python test_site.py
