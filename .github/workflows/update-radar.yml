name: Update Executive Opportunity Radar

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: write

concurrency:
  group: executive-opportunity-radar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Update public-source data
        run: python aggregate.py

      - name: Commit data changes
        run: |
          git config user.name "executive-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json history.json changes.json meta.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update executive opportunity data"
            git push
          fi
