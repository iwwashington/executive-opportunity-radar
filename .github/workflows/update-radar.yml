name: Update Executive Opportunity Radar

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: executive-opportunity-radar-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Verify pipeline controls
        run: |
          python test_aggregate.py
          python test_coverage.py

      - name: Update public-source data
        run: python aggregate.py

      - name: Verify site can render before publishing
        run: python test_site.py

      - name: Commit data changes
        run: |
          git config user.name "executive-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json history.json changes.json meta.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update executive opportunity data"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Allow artifact metadata to propagate
        run: sleep 20

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Publish the warnings before making the run visibly fail for degraded collection.
      - name: Flag incomplete automated collection
        run: |
          python - <<'PYHEALTH'
          import json, os
          from pathlib import Path
          meta = json.loads(Path('meta.json').read_text())
          coverage = meta['coverage']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as report:
              report.write(f"Healthy automated sources: {coverage['automated_healthy']}/{coverage['automated_expected']}\n\n")
              report.write("Sources requiring review: " + ", ".join(coverage['sources_requiring_review']) + "\n")
          if coverage['automated_status'] != 'complete':
              raise SystemExit('Automated collection degraded; published coverage warnings and preserved prior roles.')
          PYHEALTH
