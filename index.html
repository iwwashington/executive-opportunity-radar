let payload=FALLBACK_JOBS, meta=FALLBACK_META, tab='jobs';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>(s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const saved=()=>new Set(JSON.parse(localStorage.getItem('execRadarSaved')||'[]'));
const setSaved=s=>localStorage.setItem('execRadarSaved',JSON.stringify([...s]));
function fmtDate(value){if(!value)return '';const d=new Date(value.length===10?value+'T12:00:00':value);return isNaN(d)?'':d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});}
function recency(j){return j.posted_date || (j.first_seen||'').slice(0,10) || '0000-00-00';}
function displayDate(j){
  if(j.posted_date){const approx=j.date_basis==='posted_relative'?'≈ ':'';return {text:`Posted ${approx}${fmtDate(j.posted_date)}`, cls:'date-pill'};}
  return {text:`First seen ${fmtDate((j.first_seen||'').slice(0,10))||'date unavailable'}`, cls:'firstseen'};
}
function isDMV(s){return /washington\s*,?\s*d\.?c\.?|district of columbia|alexandria|arlington|mclean|reston|bethesda|silver spring|maryland|virginia|\bdc\b|\bdmv\b/i.test(s||'');}
function currentJobs(){
  let jobs=[...(payload.jobs||[])], q=$('#q').value.trim().toLowerCase(), src=$('#source').value, loc=$('#location').value, fav=saved();
  if(q) jobs=jobs.filter(j=>[j.organization,j.title,j.location,j.source].join(' ').toLowerCase().includes(q));
  if(src) jobs=jobs.filter(j=>j.source===src);
  if(loc==='remote') jobs=jobs.filter(j=>/remote/i.test(j.location||''));
  if(loc==='dmv') jobs=jobs.filter(j=>isDMV(j.location));
  if(tab==='favorites') jobs=jobs.filter(j=>fav.has(j.id));
  const sort=$('#sort').value;
  if(sort==='source') jobs.sort((a,b)=>(a.source||'').localeCompare(b.source||'')||(a.organization||'').localeCompare(b.organization||''));
  else if(sort==='org') jobs.sort((a,b)=>(a.organization||'').localeCompare(b.organization||''));
  else jobs.sort((a,b)=>recency(b).localeCompare(recency(a))||(a.organization||'').localeCompare(b.organization||''));
  return jobs;
}
function card(j){const fav=saved(), d=displayDate(j);return `<div class="card">
  <div><div class="org">${esc(j.organization||'Organization not parsed')}</div><div class="role">${esc(j.title)}</div>
  <div class="meta"><span class="pill">${esc(j.source)}</span>${j.location?`<span>${esc(j.location)}</span>`:''}<span class="pill ${d.cls}">${esc(d.text)}</span></div></div>
  <div class="actions"><button class="star ${fav.has(j.id)?'on':''}" data-save="${esc(j.id)}" title="Save">★</button><a class="open" href="${esc(j.url||j.source_url)}" target="_blank" rel="noopener">Open ↗</a></div>
</div>`;}
function renderJobs(){
  const jobs=currentJobs(), el=$('#jobs'), sourcesCount=(meta.sources||[]).length;
  const automated=(meta.sources||[]).filter(s=>s.mode==='automated').length;
  $('#summary').innerHTML=`<span><strong>${jobs.length}</strong> roles shown</span><span><strong>${sourcesCount}</strong> sources tracked</span><span><strong>${automated}</strong> set for automated checks</span>`;
  $('#sourcesPanel').style.display='none';el.style.display='block';
  if(!jobs.length){el.innerHTML='<div class="empty">No roles match these filters.</div>';return;}
  if($('#sort').value!=='date'){el.innerHTML=`<div class="grid">${jobs.map(card).join('')}</div>`;bindStars();return;}
  const groups=new Map();
  jobs.forEach(j=>{const key=recency(j);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(j);});
  el.innerHTML=[...groups.entries()].map(([date,items])=>`<section class="date-block"><div class="date-head">${date==='0000-00-00'?'Date unavailable':fmtDate(date)}</div><div class="grid">${items.map(card).join('')}</div></section>`).join('');
  bindStars();
}
function statusLabel(s){
  const m={ok:['Working','s-ok'],configured:['Ready for first run','s-config'],'checked-no-matches':['Checked — no matching roles','s-empty'],'empty-dynamic':['Dynamic/empty — review','s-empty'],failed:['Failed','s-failed'],manual:['Manual watch','s-manual'],retired:['Retired','s-muted'],legacy:['Legacy / duplicate','s-muted'],'no-public-list':['No public list','s-muted']};
  return m[s.status]||[s.status||s.mode||'Unknown','s-muted'];
}
function renderSources(){
  const el=$('#sourcesPanel'), rows=meta.sources||[], counts={}; rows.forEach(r=>counts[r.status]=(counts[r.status]||0)+1);
  const working=rows.filter(r=>r.status==='ok').length, failed=rows.filter(r=>r.status==='failed').length, manual=rows.filter(r=>['manual','no-public-list','legacy','retired'].includes(r.status)).length;
  $('#summary').innerHTML=`<span><strong>${rows.length}</strong> sources tracked</span><span><strong>${working}</strong> confirmed working on last run</span>${failed?`<span><strong>${failed}</strong> failed</span>`:''}<span><strong>${manual}</strong> manual / non-automated</span>`;
  $('#jobs').style.display='none';el.style.display='block';
  el.innerHTML=`<div class="source-head"><div>Source</div><div>Status</div><div>Roles</div><div>Notes</div></div>`+rows.map(s=>{const [label,cls]=statusLabel(s);return `<div class="source-row"><div><div class="source-name"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.source)} ↗</a></div><div class="group-label">${esc(s.group||'')}</div></div><div class="status ${cls}">${esc(label)}</div><div class="source-count">${Number.isFinite(+s.count)?esc(s.count):'—'}</div><div class="notes">${s.error?`<strong>${esc(s.error)}</strong><br>`:''}${esc(s.notes||'')}</div></div>`}).join('');
}
function bindStars(){$$('[data-save]').forEach(b=>b.onclick=()=>{const s=saved(),id=b.dataset.save;s.has(id)?s.delete(id):s.add(id);setSaved(s);render();});}
function render(){tab==='sources'?renderSources():renderJobs();}
function populateSources(){
  const all=(meta.sources||[]).map(s=>s.source).filter(Boolean);const jobSources=(payload.jobs||[]).map(j=>j.source).filter(Boolean);const names=[...new Set([...all,...jobSources])].sort((a,b)=>a.localeCompare(b));
  $('#source').innerHTML='<option value="">All sources</option>'+names.map(n=>`<option>${esc(n)}</option>`).join('');
}
async function boot(){
  try{const r=await fetch('jobs.json?ts='+Date.now(),{cache:'no-store'});if(r.ok){const j=await r.json();if(Array.isArray(j.jobs)&&j.jobs.length)payload=j;}}catch(e){}
  try{const r=await fetch('meta.json?ts='+Date.now(),{cache:'no-store'});if(r.ok){const m=await r.json();if(Array.isArray(m.sources)&&m.sources.length)meta=m;}}catch(e){}
  const generated=payload.generated_at||meta.generated_at;$('#lastRefresh').textContent=generated?fmtDate(generated)+' · '+new Date(generated).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'Not run yet';
  populateSources();render();
}
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;render();});
['q','source','location','sort'].forEach(id=>$('#'+id).addEventListener(id==='q'?'input':'change',render));
boot();
</script>
