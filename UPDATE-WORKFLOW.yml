name: Refresh executive opportunities
on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scraper/aggregate.py
      - name: Commit refreshed feed
        run: |
          git config user.name "exec-radar-bot"
          git config user.email "exec-radar-bot@users.noreply.github.com"
          git add data/jobs.json data/meta.json
          git diff --cached --quiet || git commit -m "Refresh executive opportunities"
          git push
